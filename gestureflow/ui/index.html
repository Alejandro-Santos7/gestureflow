<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GestureFlow</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg0:#060e20;--bg1:#0b1326;--c1:#131b2e;--c2:#171f33;--c3:#222a3d;--c4:#2d3449;--c5:#31394d;--line:#1e293b;
  --fg:#dae2fd;--mut:#bcc9cd;--dim:#869397;--cy:#4cd7f6;--cy2:#06b6d4;--gr:#4edea3;--gr2:#1bbd85;--bl:#adc6ff;
  --red:#ffb4ab;--redbg:#3a0a10;--edge:#5b6b70;
  --on-cy:#003640;--on-cy2:#00424f;--on-gr:#003824;--on-red:#ffdad6;--cy-hi:#7fe3f9;--red-hi:#93000a;
  --ease:cubic-bezier(.16,1,.3,1);--warn:#f59e0b;--err:#ef4444;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font:14px/1.45 Inter,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden}
body.main{background:var(--bg1)}
button{font-family:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:'liga';user-select:none}
.mono{font-family:var(--mono)}
input[type=range]{accent-color:var(--cy);flex:1;height:24px;cursor:pointer;min-width:0}
input[type=text],input[type=email]{min-height:48px;border-radius:8px;border:1px solid var(--edge);background:var(--bg1);color:var(--fg);caret-color:var(--cy);padding:0 12px;font:inherit;font-size:14px;user-select:text;width:100%}
::selection{background:color-mix(in srgb,var(--cy) 35%,transparent);color:var(--fg)}
input::placeholder{color:var(--dim)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--c4);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
/* ---------- marco ---------- */
#win{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg1);border:1px solid color-mix(in srgb,var(--cy) 18%,transparent);overflow:hidden}
#top{height:48px;flex:none;display:flex;align-items:center;gap:14px;padding:0 0 0 14px;background:var(--bg0);border-bottom:1px solid var(--line)}
#top img{width:24px;height:24px}
.brand{font-weight:700;font-size:15px}
.suite{font:11px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--cy) 35%,transparent);color:var(--cy)}
#pill{flex:1;display:flex;justify-content:center;min-width:0}
#pill>div{display:flex;align-items:center;gap:10px;padding:5px 14px;border-radius:99px;background:var(--c2);border:1px solid color-mix(in srgb,var(--cy) 20%,transparent);font:12px var(--mono);white-space:nowrap;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gr);flex:none}
#pauseTop{border:1px solid color-mix(in srgb,var(--red) 50%,transparent);cursor:pointer;color:var(--red);background:var(--c2);border-radius:8px;height:34px;padding:0 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;margin-left:auto}
#pauseTop .ms{font-size:18px}
.wbtn{border:0;background:transparent;color:var(--fg);width:46px;height:48px;cursor:pointer}
.wbtn:hover{background:var(--c3)}.wbtn.x:hover{background:var(--red-hi)}
.wbtn .ms{font-size:18px}
#body{flex:1;display:flex;min-height:0}
nav{width:250px;flex:none;background:var(--bg0);border-right:1px solid var(--line);padding:16px 8px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.navlab{font:11px var(--mono);letter-spacing:.08em;color:var(--dim);padding:4px 10px 8px}
.nb{border:0;cursor:pointer;text-align:left;min-height:58px;border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:12px;background:transparent;color:var(--mut)}
.nb:hover{background:var(--c3)}.nb.on{background:var(--c3);color:var(--cy)}
.nb b{display:block;font-weight:600;font-size:14px}.nb small{display:block;font-size:12px;color:var(--dim)}
.ob{border:1px solid var(--line);cursor:pointer;text-align:left;min-height:48px;border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;background:transparent;font-size:13px;font-weight:500}
.ob:hover{background:var(--c3)}.ob.on{background:color-mix(in srgb,var(--cy) 14%,transparent);border-color:var(--cy)}
.ob .ms{font-size:20px;color:var(--cy)}
.engine{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--c1);font:11px/1.5 var(--mono);color:var(--gr)}
main{flex:1;min-width:0;overflow:auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:22px}
#status{height:32px;flex:none;background:var(--bg0);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:12px var(--mono);color:var(--mut)}
@media (max-width:1100px){nav{width:76px}.nb span:last-child,.navlab,.ob span:last-child,.engine{display:none}#pill{display:none}}
/* ---------- piezas ---------- */
.between{display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.hpill{padding:5px 10px;background:var(--c3);border-radius:99px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:4px 0 0;font-size:30px;letter-spacing:-.02em;line-height:1.15}
h2{margin:0;font-size:22px;display:flex;gap:10px;align-items:center}
.sub{margin:6px 0 0;color:var(--mut);font-size:15px;max-width:720px;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.card{background:var(--c2);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.c1{background:var(--c1)}.card.c3{background:var(--c3)}
.ct{display:flex;gap:12px;align-items:center;font-size:20px;font-weight:600}.ct .ms{color:var(--cy)}
.chip{font:13px var(--mono);color:var(--cy);background:var(--c4);padding:2px 10px;border-radius:6px;white-space:nowrap}
.pillg{font:11px var(--mono);padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600;background:color-mix(in srgb,var(--gr2) 20%,transparent);color:var(--gr)}
.pillg.off{background:var(--c4);color:var(--mut)}.pillg.blue{background:var(--c4);color:var(--bl)}.pillg.bad{background:color-mix(in srgb,var(--err) 20%,transparent);color:var(--red)}
.hint{color:var(--mut);font-size:14px;text-wrap:pretty}
.btn{min-height:56px;border:0;cursor:pointer;border-radius:12px;padding:0 20px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c3);color:var(--fg)}
.btn:hover{background:var(--c4)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--cy);color:var(--on-cy);font-weight:700;box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}.btn.pri:hover{background:var(--cy-hi)}
.btn.ok{background:var(--gr2);color:var(--on-gr)}.btn.dan{background:var(--redbg);color:var(--on-red)}
.btn[disabled]{opacity:.45;cursor:default}
.sq{flex:none;width:56px;height:56px;border:0;cursor:pointer;border-radius:12px;background:var(--c3);color:var(--fg)}
.sq:hover{background:var(--c5)}.sq:active{transform:scale(.95)}
.sl{background:var(--c1);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.slh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.slr{display:flex;align-items:center;gap:14px}
.sw{position:relative;flex:none;width:64px;height:40px;border:0;cursor:pointer;border-radius:99px;background:var(--c4);transition:background .2s}
.sw .knob{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:var(--on-cy2);color:#acedff;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
.sw .knob .ms{font-size:16px}.sw.on{background:var(--cy2)}.sw.on .knob{transform:translateX(24px)}
.sw.big{width:96px;height:56px}.sw.big .knob{width:48px;height:48px}.sw.big.on .knob{transform:translateX(40px)}.sw.big .ms{font-size:22px}
.tg{background:var(--c1);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.tg>span{display:flex;gap:12px;align-items:center}.tg b{display:block;font-size:14px}.tg small{display:block;font-size:13px;color:var(--mut)}
.seg{display:flex;padding:4px;background:var(--c1);border-radius:14px;gap:4px}
.seg button{min-height:48px;border:0;cursor:pointer;border-radius:10px;padding:0 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;background:transparent;color:var(--mut)}
.seg button.on{background:var(--c3);color:var(--cy)}
.bar{height:14px;background:var(--c4);border-radius:99px;padding:2px}.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--gr));transition:width .2s}
.bar.thin{height:8px;padding:0;overflow:hidden}
/* feed de cámara */
.feed{position:relative;aspect-ratio:4/3;background:var(--bg0);border-radius:16px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.6);background-image:radial-gradient(var(--c2) 1px,transparent 1px);background-size:24px 24px}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.feed canvas{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;background:color-mix(in srgb,var(--c2) 92%,transparent);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.badge.m{font:12px var(--mono);padding:6px 12px;border-radius:8px;color:var(--cy);background:color-mix(in srgb,var(--c3) 92%,transparent)}
.nosig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--dim);font:13px var(--mono)}
/* telemetría */
.tele{background:var(--c2);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.tele .k{font:11px var(--mono);letter-spacing:.06em;color:var(--dim)}
.tele .v{font:700 32px var(--mono)}.tele .u{font:13px var(--mono);color:var(--mut)}
.tele .n{font-size:12px;color:var(--mut)}.tele .st{font:600 11px var(--mono)}
/* gestos */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{background:var(--c1);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .3s,background .3s}
.gcard.flash{background:var(--c3);box-shadow:0 0 0 2px var(--gr)}.gcard.wait{box-shadow:0 0 0 2px var(--cy)}
.gcard.lock{background:transparent;box-shadow:inset 0 0 0 1px var(--c4)}.gcard.lock .gic{opacity:.5}
.gic{width:44px;height:44px;border-radius:10px;background:var(--c3);display:flex;align-items:center;justify-content:center;flex:none}
.act{border:0;cursor:pointer;text-align:left;background:var(--c3);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.act:hover{background:var(--c4)}
/* tablas */
.tbl{background:var(--c1);border-radius:16px;overflow:hidden}
.tr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;padding:16px 20px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.tr.h{background:var(--c2);font:11px var(--mono);letter-spacing:.06em;border-top:0;padding:14px 20px}
/* toast */
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg1);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:80;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .25s var(--ease)}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast .ms{color:#00687a;font-size:20px}
/* paneles flotantes */
.panel{position:fixed;inset:0;background:rgba(15,23,42,.97);border:1px solid color-mix(in srgb,var(--cy) 25%,transparent);border-radius:20px;display:flex;flex-direction:column;gap:12px;padding:16px;overflow:auto}
.ai{border:0;cursor:pointer;text-align:left;min-height:68px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:14px;background:var(--c2)}
.ai:hover{filter:brightness(1.15)}.ai .ms{font-size:28px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px}
.ai.on{background:var(--cy);color:var(--on-cy)}.ai.dan{background:var(--redbg);color:var(--on-red)}
.ai b{display:block;font-size:17px;font-weight:600}.ai small{display:block;font:12px var(--mono);opacity:.85}
.target{padding:0;font:inherit;color:inherit;position:absolute;border-radius:50%;background:var(--c2);border:2px solid var(--cy);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;transform:translate(-50%,-50%)}
.target .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:color-mix(in srgb,var(--cy) 35%,transparent)}
.target.hit{border-color:var(--gr)}.target.hit .fill{height:100%}
.ripple{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:color-mix(in srgb,var(--cy) 40%,transparent);pointer-events:none;animation:rip .35s forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes ripfade{from{opacity:1}to{opacity:0}}
/* movimiento reducido: sin desplazamientos ni escalas; se conservan color, opacidad y los rellenos de dwell (indican tiempo) */
@media (prefers-reduced-motion:reduce){
  #toast,#toast.on{transform:translateX(-50%)}
  .btn:active,.sq:active{transform:none}
  .sw .knob{transition:none}
  .ripple{animation-name:ripfade;transform:none}
}
.step{display:none}.step.on{display:flex}
.kbd{font:12px var(--mono);background:var(--c3);border-radius:6px;padding:2px 8px;color:var(--cy)}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"><span class="ms" aria-hidden="true">info</span><span id="toastTxt"></span></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const OVL = location.hash.slice(1) || 'main';
let bk = null;
let S = { cfg: {}, cameras: [], files: [], runs: [], modes: [], overlays: {} };
let T = { fps: 0, latency: 0, bright: 0, cpu: 0, ram: 0, paused: false, source: 'reglas', conf: 0, det: 0, pressure: 0, jitter: 0, clicks: 0, event: ['En espera', 0], zone: [.2, .2, .8, .75], screen: [1920, 1080] };
const ui = { view: 'mon', dirty: false, lastEdit: 0, phase: 1, roadTab: 'sla', testing: null, testUntil: 0, flash: null,
  trainBusy: false, trainRes: null, rounds: 6, user: 'usuario', recording: false,
  tut: 0, tutOk: {}, tutClicks: 0, palmaSince: 0,
  lab: { hits: [], miss: 0, times: [], hover: null, t0: 0, tm: null }, sandClicks: 0, dwTest: 0, started: Date.now() };
const call = (name, ...a) => bk && bk[name] && bk[name](...a);
const rnd = (k, v) => +(+v).toFixed((String(SL[k].step).split('.')[1] || '').length);

/* ---------- utilidades ---------- */
function toast(m) { $('#toastTxt').textContent = m; const t = $('#toast'); t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), 2400); }
const on = () => !T.paused && !(T.rec);
/* los ticks llegan a ~30 Hz: solo reescribir el HTML cuando cambia */
const setHTML = (el, h) => { if (el && el._h !== h) { el._h = h; el.innerHTML = h; } };
const pct = (v, a, b) => Math.max(0, Math.min(100, (v - a) / (b - a) * 100));
const brightPct = () => Math.round(T.bright / 255 * 100);
const brightOk = () => T.bright >= 95 && T.bright <= 165;
const ACT = { left: ['Clic izquierdo', 'mouse'], right: ['Clic derecho', 'contextual_token'], double: ['Doble clic', 'ads_click'], drag: ['Arrastrar y soltar', 'drag_indicator'], middle: ['Clic central', 'adjust'], none: ['Sin acción', 'block'] };
const camName = () => S.cameras[S.cfg.camera_index] || ('Cámara ' + S.cfg.camera_index);

const SL = {
  sens: { label: 'Sensibilidad del movimiento', min: 1, max: 10, step: 1, fmt: v => `Nivel ${v} / 10`, hint: 'Más sensibilidad = zona activa más pequeña: menos recorrido del brazo para cruzar la pantalla.' },
  max_speed: { label: 'Velocidad máxima del cursor', min: 400, max: 4000, step: 100, fmt: v => `${v} px/s`, hint: 'Límite de aceleración para evitar saltos fuera de pantalla.' },
  dead_px: { label: 'Zona muerta', min: 0, max: 40, step: 1, fmt: v => `${v} px`, hint: 'Movimientos menores se ignoran: el cursor reposa sin deriva.' },
  min_cutoff: { label: 'Intensidad del filtro', min: 0.1, max: 5, step: 0.1, fmt: v => `${(+v).toFixed(1)} Hz`, hint: 'Menor = más suave y estable; mayor = más directo.' },
  beta: { label: 'Reactividad al mover rápido', min: 0, max: 0.05, step: 0.001, fmt: v => (+v).toFixed(3), hint: 'Más alto = menos retardo cuando mueves la mano rápido (cursor más fluido); más bajo = más suave.' },
  dwell_ms: { label: 'Tiempo de permanencia (dwell)', min: 300, max: 2500, step: 100, fmt: v => `${(v / 1000).toFixed(1)} s`, hint: 'Tiempo inmóvil antes del clic automático.' },
  debounce_ms: { label: 'Retención antirrebote', min: 50, max: 600, step: 10, fmt: v => `${v} ms`, hint: 'Bloqueo tras cada clic que evita dobles pulsaciones involuntarias.' },
  dwell_radius: { label: 'Radio de permanencia', min: 10, max: 100, step: 5, fmt: v => `${v} px`, hint: 'Cuánto puede moverse el cursor sin reiniciar el dwell.' },
  pinch_conf: { label: 'Confianza mínima del pellizco', min: 0.5, max: 0.99, step: 0.01, fmt: v => `${Math.round(v * 100)} %`, hint: 'Más alto = menos clics fantasma (con modelo personal).' },
};
function slider(k, compact) {
  const d = SL[k], v = S.cfg[k];
  return `<div class="sl" data-sl="${k}"><div class="slh"><b>${d.label}</b><span class="chip" data-v>${d.fmt(v)}</span></div>
  ${compact ? '' : `<div class="hint">${d.hint}</div>`}
  <div class="slr"><button class="sq" data-a="bump" data-k="${k}" data-d="-1" aria-label="Disminuir ${d.label}"><span class="ms">remove</span></button>
  <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" data-k="${k}" aria-label="${d.label}">
  <button class="sq" data-a="bump" data-k="${k}" data-d="1" aria-label="Aumentar ${d.label}"><span class="ms">add</span></button></div></div>`;
}
function setCfg(k, v, rerender) {
  S.cfg[k] = v; ui.dirty = true; ui.lastEdit = Date.now();
  call('setConfig', k, JSON.stringify(v));
  $$(`[data-sl="${k}"]`).forEach(el => { el.querySelector('[data-v]').textContent = SL[k].fmt(v); const r = el.querySelector('input'); if (+r.value !== v) r.value = v; });
  const sv = $('#saved'); if (sv) { sv.textContent = 'cambios sin guardar'; sv.style.color = 'var(--warn)'; }
  if (rerender) render();
}
function sw(k, label, big) {
  const v = S.cfg[k];
  return `<button class="sw ${big ? 'big' : ''} ${v ? 'on' : ''}" data-a="tog" data-k="${k}" role="switch" aria-checked="${!!v}" aria-label="${label}"><span class="knob"><span class="ms">${v ? 'check' : 'close'}</span></span></button>`;
}
function toggleRow(k, icon, t, d, color) {
  return `<div class="tg"><span><span class="ms" style="color:${color}">${icon}</span><span><b>${t}</b><small>${d}</small></span></span>${sw(k, t)}</div>`;
}

/* ---------- feed de cámara ---------- */
/* el canvas no entiende var(): lee los tokens una vez */
const K = Object.fromEntries(['cy', 'cy2', 'gr', 'fg', 'bg1'].map(n => [n, getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim()]));
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
function feed(id, big) {
  return `<div class="feed" id="${id}" data-big="${big ? 1 : 0}"><img alt=""><canvas></canvas>
  <div class="nosig"><span class="ms" style="font-size:40px">videocam</span><span>Esperando cámara…</span></div></div>`;
}
function drawFeed(el) {
  const c = el.querySelector('canvas'), r = el.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (!r.width) return;
  if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const g = c.getContext('2d'), W = c.width, H = c.height, big = el.dataset.big === '1', s = dpr * (big ? 1 : .7);

/* el re-render reemplaza el HTML: guarda qué control tenía el foco para devolvérselo */
function focusKey() {
  const f = document.activeElement; if (!f || f === document.body) return null;
  if (f.id) return '#' + CSS.escape(f.id);
  const at = ['a', 'v', 'k', 'd'].filter(x => f.dataset[x] != null).map(x => `[data-${x}="${CSS.escape(f.dataset[x])}"]`).join('');
  return at ? f.tagName.toLowerCase() + at : null;
}
function render() {
  const fk = focusKey();
  if (OVL !== 'main') { renderOverlay(); } else {
    const m = $('#main'); if (!m) return;
    const st = m.scrollTop; m.innerHTML = VIEWS[ui.view](); if (ui.lastView === ui.view) m.scrollTop = st; ui.lastView = ui.view;
    $$('.nb').forEach(b => { const o = b.dataset.v === ui.view; b.classList.toggle('on', o); o ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
    $$('.ob').forEach(b => { const o = !!S.overlays[b.dataset.v]; b.classList.toggle('on', o); b.setAttribute('aria-pressed', o); });
    bindView(); syncFeeds(); onTick(T, true);
  }
  const n = fk && document.activeElement === document.body && $(fk); if (n) n.focus({ preventScroll: true });
}
/* los iconos son ligaduras de texto («pause_circle»): ocultarlos a lectores de pantalla */
new MutationObserver(rs => rs.forEach(r => r.addedNodes.forEach(n => {
  if (n.nodeType !== 1) return; if (n.classList.contains('ms')) n.setAttribute('aria-hidden', 'true');
  n.querySelectorAll('.ms').forEach(e => e.setAttribute('aria-hidden', 'true'));
}))).observe(document.body, { childList: true, subtree: true });
function bindView() {
  $$('#main input[type=range][data-k]').forEach(r => r.addEventListener('input', () => { const k = r.dataset.k, d = SL[k]; setCfg(k, rnd(k, r.value)); }));
  const tz = $('#tZone'); if (tz) tz.addEventListener('mouseenter', () => { tz.textContent = '✓ ¡Perfecto!'; tutDone(1); });
  const tr = $('#tRange'); if (tr) tr.addEventListener('input', () => { $('#tVal').textContent = tr.value; if (Math.abs(tr.value - 75) <= 8) tutDone(3); });
  const tu = $('#trUser'); if (tu) tu.addEventListener('input', () => ui.user = tu.value);
  $$('.target').forEach(t => {
    const i = +t.dataset.t;
    t.addEventListener('mouseenter', () => { const L = ui.lab; if (L.hits.includes(i)) return; L.hover = i; L.t0 = Date.now(); const f = t.querySelector('.fill'); f.style.transition = `height ${S.cfg.dwell_ms}ms linear`; f.style.height = '100%'; clearTimeout(L.tm); L.tm = setTimeout(() => labHit(i), S.cfg.dwell_ms); });
    t.addEventListener('mouseleave', () => { const L = ui.lab; clearTimeout(L.tm); L.hover = null; const f = t.querySelector('.fill'); if (!L.hits.includes(i)) { f.style.transition = 'none'; f.style.height = '0'; } });
  });

    dz.addEventListener('mouseenter', () => { const f = $('#dwFill'); f.style.transition = `width ${S.cfg.dwell_ms}ms linear`; f.style.width = '100%'; $('#dwTxt').textContent = 'Fijando…'; clearTimeout(ui.dwT); ui.dwT = setTimeout(() => { dz.style.background = 'var(--cy2)'; $('#dwTxt').textContent = '¡CLIC CONFIRMADO!'; toast('¡Clic por permanencia confirmado!'); }, S.cfg.dwell_ms); });

function updateBanner(forceMsg) {

}

    <div style="background:var(--c1);border-radius:12px;padding:8px 8px 8px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px">Mano activa<div style="display:flex;gap:4px;background:var(--bg1);padding:4px;border-radius:10px">${['Izquierda', 'Derecha'].map(h => `<button data-a="hand" data-v="${h}" aria-pressed="${S.cfg.hand === h}" class="mono" style="border:0;cursor:pointer;border-radius:7px;height:40px;padding:0 14px;font-size:13px;${S.cfg.hand === h ? 'background:var(--cy);color:var(--on-cy)' : 'background:var(--c3)'}">${h}</button>`).join('')}</div></div>
    <div style="background:var(--c1);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:600;font-size:14px">Suavizado del cursor</div><div class="mono" style="font-size:11px;color:var(--dim)">Filtro One Euro</div></div>${sw('filter', 'Suavizado del cursor')}</div>
   </div></div>
   <div><div class="mono" style="font-size:12px;color:var(--dim);letter-spacing:.06em;margin-bottom:8px">PRÓXIMO CLIC</div>
   <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${[['left', 'mouse', 'Clic izquierdo'], ['right', 'contextual_token', 'Clic derecho'], ['drag', 'pan_tool', 'Arrastrar'], ['double', 'ads_click', 'Doble clic']].map(a => `<button data-a="arm" data-v="${a[0]}" id="ha-${a[0]}" class="mono" style="min-height:74px;border:0;cursor:pointer;font-size:12px;font-weight:600;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--c3)"><span class="ms">${a[1]}</span>${a[2]}</button>`).join('')}</div></div>
   <div style="display:flex;flex-wrap:wrap;gap:12px;background:var(--c1);border-radius:14px;padding:12px;align-items:center">
    <button class="btn" data-a="recenter" style="flex:1 1 150px;min-height:64px"><span class="ms" style="color:var(--cy)">filter_center_focus</span>Recentrar</button>
    <div style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:11px;color:var(--dim)">SENS.</span><button class="sq" data-a="bump" data-k="sens" data-d="-1" aria-label="Bajar sensibilidad"><span class="ms">remove</span></button><span class="mono" style="color:var(--cy);min-width:44px;text-align:center" id="hSens">${S.cfg.sens}/10</span><button class="sq" data-a="bump" data-k="sens" data-d="1" aria-label="Subir sensibilidad"><span class="ms">add</span></button></div>
    <button data-a="pause" id="hPause" style="flex:1 1 150px;min-height:64px;border:0;cursor:pointer;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px"></button></div></div>`;
  if (OVL === 'tray') r.innerHTML = `<div class="panel" style="padding:18px">
   <div class="between"><div style="display:flex;gap:12px;align-items:center"><img src="logo.svg" style="width:40px;height:40px"><div><div class="mono" style="font-weight:700">GESTUREFLOW <span style="font-size:11px;color:var(--cy);background:var(--c2);padding:1px 6px;border-radius:4px">FASE 1</span></div><div style="font-size:12px" id="trStatus">—</div></div></div>
   <button class="sw" data-a="pause" id="trSw" style="width:72px;height:44px" role="switch" aria-checked="false" aria-label="Seguimiento de la mano"><span class="knob" style="width:36px;height:36px;background:var(--fg);color:var(--bg1)"><span class="ms" style="font-size:18px">check</span></span></button></div>
   <div style="display:flex;gap:8px">${[['CPU PIPELINE', 'tyCpu', 'var(--fg)'], ['FRAME RATE', 'tyFps', 'var(--gr)'], ['LATENCIA', 'tyLat', 'var(--cy)']].map(t => `<div style="flex:1;background:var(--c2);border-radius:10px;padding:8px 10px"><div class="mono" style="font-size:11px;color:var(--dim)">${t[0]}</div><div class="mono" style="font-size:18px;font-weight:700;color:${t[2]}" id="${t[1]}">—</div></div>`).join('')}</div>
   ${slider('sens', true)}${slider('dwell_ms', true)}
   <div class="mono" style="font-size:11px;color:var(--dim);letter-spacing:.08em">MODO OPERATIVO INMEDIATO</div>
   <div style="display:flex;gap:8px">${S.modes.map((m, i) => `<button data-a="mode" data-v="${i}" aria-pressed="${S.cfg.mode === i}" class="mono" style="flex:1;min-height:64px;border:0;cursor:pointer;font-size:11px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;${S.cfg.mode === i ? 'background:var(--c4);color:var(--cy)' : 'background:var(--c2);color:var(--mut)'}"><span class="ms" style="font-size:22px">${m.icon}</span>${m.name}</button>`).join('')}</div>
   <div style="display:flex;gap:8px"><button class="btn" data-a="view" data-v="lab" style="flex:1"><span class="ms" style="color:var(--cy);font-size:20px">tune</span>Recalibrar</button><button class="btn dan" data-a="pause" id="trFreeze" style="flex:1"></button></div>
   <div style="display:flex;gap:8px"><button class="btn" data-a="camrestart" style="flex:1"><span class="ms" style="color:var(--cy);font-size:20px">restart_alt</span>Reiniciar cámara</button><button class="btn dan" data-a="quit" style="flex:1"><span class="ms" style="font-size:20px">power_settings_new</span>Salir</button></div>
   <div style="display:flex;justify-content:space-between"><button class="btn" data-a="suite" style="background:transparent;min-height:44px;font:12px var(--mono);color:var(--mut)"><span class="ms" style="font-size:16px">open_in_new</span>Abrir suite completa</button><button class="btn" data-a="ovl" data-v="tray" style="background:transparent;min-height:44px;font:12px var(--mono);color:var(--mut)"><span class="ms" style="font-size:16px">close</span>Ocultar</button></div></div>`;
  $$('#root input[type=range][data-k]').forEach(r => r.addEventListener('input', () => { const k = r.dataset.k, d = SL[k]; setCfg(k, rnd(k, r.value)); }));
  syncFeeds(); tickOverlay();
}
function tickOverlay() {
  const o = on();
  if (OVL === 'actions') {
    AI.forEach(a => { const b = $('#ai-' + a[0]); if (!b) return; const ar = T.armed === a[0]; b.classList.toggle('on', ar); b.querySelector('[data-tag]').textContent = ar ? (T.dragging ? 'SUJETANDO' : 'ARMADO') : a[0] === 'lock' ? (T.paused ? 'REANUDAR' : 'PAUSA') : ''; });
    $('#armTxt').textContent = T.armed ? `Armado: ${ACT[T.armed][0]} — haz el próximo clic` : 'Selecciona una acción para el próximo clic';
    $('#armBar').style.width = (T.armed ? T.progress * 100 : 0) + '%';
    const mins = Math.floor((Date.now() - ui.started) / 60000), left = 20 - (mins % 20);
    $('#ergo').textContent = `Sesión: ${mins} min. Micro-pausa sugerida en ${left} min (abre la palma para descansar).`;
  }
  if (OVL === 'hud') {
    $$('.feed').forEach(drawFeed);
    $('#hDot').style.background = o ? 'var(--gr)' : 'var(--err)';
    $('#hJit').textContent = '±' + T.jitter + 'px'; $('#hFps').textContent = Math.round(T.fps) + ' FPS'; $('#hLux').textContent = 'luz ' + brightPct() + '%';
    $('#hLock').textContent = T.lm ? T.det + '% LOCK' : 'SIN SEÑAL';
    $('#hGest').textContent = !o ? 'PAUSADO' : String(T.label || 'sin mano').toUpperCase();
    $('#hPress').style.width = T.pressure + '%'; $('#hPressT').textContent = T.pressure + '%';
    ['left', 'right', 'drag', 'double'].forEach(k => { const b = $('#ha-' + k); const ar = T.armed === k; b.style.background = ar ? 'var(--cy)' : 'var(--c3)'; b.style.color = ar ? 'var(--on-cy)' : 'var(--fg)'; });
    const p = $('#hPause'); p.style.background = o ? 'var(--redbg)' : 'var(--gr2)'; p.style.color = o ? 'var(--on-red)' : 'var(--on-gr)'; setHTML(p, `<span class="ms">${o ? 'pause_circle' : 'play_circle'}</span>${o ? 'Pausar (F9)' : 'Reanudar (F9)'}`);
    $('#hSens').textContent = S.cfg.sens + '/10';
  }
  if (OVL === 'tray') {
    $('#trStatus').textContent = o ? 'Seguimiento activo y transmitiendo' : 'Seguimiento en pausa'; $('#trStatus').style.color = o ? 'var(--gr)' : 'var(--err)';
    const s = $('#trSw'); s.classList.toggle('on', o); s.setAttribute('aria-checked', o); s.style.background = o ? 'var(--gr2)' : 'var(--c4)'; s.querySelector('.knob').style.transform = o ? 'translateX(28px)' : 'none'; s.querySelector('.ms').textContent = o ? 'check' : 'close';
    $('#tyCpu').textContent = T.cpu.toFixed(1) + '%'; $('#tyFps').textContent = Math.round(T.fps) + ' FPS'; $('#tyLat').textContent = T.latency + ' ms';
    setHTML($('#trFreeze'), `<span class="ms" style="font-size:20px">${T.paused ? 'play_circle' : 'pause_circle'}</span>${T.paused ? 'Reanudar [F9]' : 'Congelar [F9]'}`);
  }
}

/* ---------- acciones (delegación de clics) ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v, k = el.dataset.k, d = +el.dataset.d;
  const A = {
    view: () => { if (OVL !== 'main') return call('showView', v); ui.view = v; render(); },
    ovl: () => call('toggleOverlay', v),
    pause: () => call('toggleTracking'),
    min: () => call('minimize'), max: () => call('toggleMax'), close: () => call('closeWindow'), suite: () => call('openSuite'),
    quit: () => call('quitApp'),
    camrestart: () => { camErr = ''; lastTick = Date.now() + 4000; updateBanner('Reiniciando cámara…'); call('restartCamera'); },
    bump: () => { const s = SL[k]; setCfg(k, rnd(k, Math.min(s.max, Math.max(s.min, S.cfg[k] + d * s.step)))); },
    tog: () => setCfg(k, !S.cfg[k], true),
    hand: () => { setCfg('hand', v); render(); },
    anchor: () => { setCfg('anchor', v); render(); },
    cam: () => { setCfg('camera_index', (S.cfg.camera_index + 1) % Math.max(1, S.cameras.length)); toast('Cambiando a ' + camName()); render(); },
    recenter: () => call('recenter'), calib: () => call('calibrate'),
    save: () => call('saveConfig', ok => { if (!ok) return; ui.dirty = false; const b = $('#saveBtn'); if (b) { b.style.background = 'var(--gr)'; b.innerHTML = '<span class="ms">task_alt</span>¡Guardado con éxito!'; setTimeout(() => ui.view === 'cfg' && render(), 1800); } const s = $('#saved'); if (s) { s.textContent = 'sin cambios'; s.style.color = 'var(--gr)'; } }),
    reset: () => { call('resetConfig'); ui.dirty = true; },
    mode: () => call('setMode', +v),
    arm: () => call('arm', v),
    sand: () => { ui.sandClicks++; $('#sandN').textContent = ui.sandClicks; if (S.cfg.visual) { const r = $('#sand').getBoundingClientRect(), x = document.createElement('div'); x.className = 'ripple'; x.style.left = (e.clientX - r.left) + 'px'; x.style.top = (e.clientY - r.top) + 'px'; $('#sand').appendChild(x); setTimeout(() => x.remove(), 400); } },
    phase: () => { ui.phase = +v; render(); },
    cycle: () => { const g = GEST.find(x => x.k === v); if (!g.act) return; const i = g.acts.indexOf(S.cfg[g.act]); setCfg(g.act, g.acts[(i + 1) % g.acts.length], true); },
    test: () => { const g = GEST.find(x => x.k === v); if (g.lock) return toast('Requiere Fase 2 Pro'); if (g.en && !S.cfg[g.en]) return toast('Activa el gesto para probarlo'); ui.testing = v; ui.testUntil = Date.now() + 6000; toast('Haz el gesto «' + g.t + '» frente a la cámara'); render(); },
    locked: () => toast(GEST.find(x => x.k === v).lock ? 'Requiere Fase 2 Pro' : 'Gesto de seguridad: siempre activo'),
    labhit: () => { e.stopPropagation(); labHit(+v); },
    labmiss: () => { if (e.target.closest('.target')) return; ui.lab.miss++; render(); },
    labreset: () => { ui.lab = { hits: [], miss: 0, times: [], hover: null, t0: 0, tm: null }; render(); },
    road: () => { ui.roadTab = v; render(); },
    role: () => { ui.role = ((ui.role || 0) + 1) % ROLES.length; $('#bRole').firstChild.textContent = ROLES[ui.role]; },
    beta: () => { const n = $('#bName').value.trim(), m = $('#bMail').value.trim(); if (!n) return $('#bErr').textContent = 'Indica tu nombre o institución.'; if (!/^\S+@\S+\.\S+$/.test(m)) return $('#bErr').textContent = 'Escribe un correo válido, por ejemplo nombre@dominio.com.'; call('saveInterest', JSON.stringify({ nombre: n, correo: m, rol: ROLES[ui.role || 0] }), ok => { if (ok) { ui.betaSent = true; render(); } }); },
    betareset: () => { ui.betaSent = false; render(); },
    rounds: () => { ui.rounds = Math.min(12, Math.max(1, ui.rounds + d)); render(); },
    rec: () => { call('startRecording', ui.user, ui.rounds); ui.recording = true; render(); },
    cancelrec: () => { call('cancelRecording'); ui.recording = false; render(); },
    discard: () => call('discardFile', v),
    train: () => { ui.trainBusy = true; ui.trainRes = null; call('train'); render(); },
    tutclick: () => { ui.tutClicks++; $('#tBtn').textContent = ui.tutClicks >= 3 ? '✓ ¡Listo!' : `Haz clic aquí (${ui.tutClicks}/3)`; if (ui.tutClicks >= 3) tutDone(2); },
    tutbump: () => { const r = $('#tRange'); r.value = +r.value + d; r.dispatchEvent(new Event('input')); },
    tutrec: () => { call('tutorialDone'); ui.view = 'train'; ui.rounds = 3; ui.recording = true; call('startRecording', ui.user, 3); render(); },
    tutnav: () => { const n = ui.tut + d; if (n >= TUT.length) { call('tutorialDone'); ui.view = 'mon'; toast('¡Tutorial completado!'); } else ui.tut = Math.max(0, n); render(); },
  };
  A[a] && A[a]();
});
document.addEventListener('keydown', e => {
  if (e.key === 'F9') e.preventDefault();  // F9 lo atiende el atajo global (Python); llamarlo aquí también lo pausaba y reanudaba a la vez
  if (e.key === 'Escape' && OVL !== 'main') call('toggleOverlay', OVL);
});
/* arrastrar y redimensionar la ventana sin marco */
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || OVL === 'tray' || OVL === 'actions') return;
  const m = 6, x = e.clientX, y = e.clientY, W = innerWidth, H = innerHeight;
  const edges = (x < m ? 'l' : x > W - m ? 'r' : '') + (y < m ? 't' : y > H - m ? 'b' : '');
  if (edges && OVL === 'main') { call('startResize', edges); e.preventDefault(); return; }
  if (e.target.closest('[data-drag]') && !e.target.closest('button')) { call('startMove', OVL); e.preventDefault(); }
});
document.addEventListener('dblclick', e => { if (OVL === 'main' && e.target.closest('#top') && !e.target.closest('button')) call('toggleMax'); });
document.addEventListener('mousemove', e => {
  if (OVL !== 'main') return; const m = 6, x = e.clientX, y = e.clientY, W = innerWidth, H = innerHeight;
  const l = x < m, r = x > W - m, t = y < m, b = y > H - m;
  document.body.style.cursor = (l && t) || (r && b) ? 'nwse-resize' : (r && t) || (l && b) ? 'nesw-resize' : l || r ? 'ew-resize' : t || b ? 'ns-resize' : '';
});

/* ---------- arranque ---------- */
function onState(js) {
  const s = JSON.parse(js), structural = JSON.stringify([s.files, s.runs, s.overlays, s.cameras]) !== JSON.stringify([S.files, S.runs, S.overlays, S.cameras]);
  const cfgChanged = JSON.stringify(s.cfg) !== JSON.stringify(S.cfg) && Date.now() - ui.lastEdit > 800;
  S = s; if (structural || cfgChanged) render();
}
function boot(backend) {
  bk = backend;
  bk.tick.connect(js => onTick(JSON.parse(js)));
  bk.state.connect(onState);
  bk.toast.connect(toast);
  bk.camError.connect(m => { camErr = m; updateBanner(); });
  bk.trained.connect(js => { ui.trainBusy = false; ui.trainRes = JSON.parse(js); ui.view === 'train' && render(); toast(ui.trainRes.ok ? 'Entrenamiento terminado' : 'No se pudo entrenar: revisa el motivo en «3 · Entrenar»'); });
  bk.recDone.connect(js => {
    ui.recording = false; const r = JSON.parse(js), auto = S.cfg.auto_train;
    if (auto) { ui.trainBusy = true; ui.trainRes = null; }
    toast(auto ? `¡Listo! ${r.n} muestras guardadas. Entrenando tu modelo…` : `¡Listo! ${r.n} muestras guardadas`);
    ui.view === 'train' && render();
    const m = $('#trMsg'); if (m) m.textContent = auto ? `¡Listo! ${r.n} muestras guardadas. Entrenando tu modelo con todos tus datos…` : `¡Listo! ${r.n} muestras guardadas. Ahora pulsa «Entrenar modelo».`;
  });
  bk.getState(js => {
    S = JSON.parse(js);
    if (OVL === 'main') { document.body.classList.add('main'); $('#root').innerHTML = shell(); ui.view = S.cfg.tutorial_done ? 'mon' : 'tut'; }
    render();
  });
}
if (window.qt && qt.webChannelTransport) new QWebChannel(qt.webChannelTransport, ch => boot(ch.objects.backend));
else boot(mockBackend());

/* backend simulado: permite ver la interfaz en un navegador sin Python */
function mockBackend() {
  const sig = () => { const f = []; return { connect: g => f.push(g), emit: v => f.forEach(g => g(v)) }; };
  const st = { cfg: { camera_index: 0, hand: 'Derecha', zone_center: [.5, .47], sens: 5, anchor: 'nudillos', max_speed: 2400, dead_px: 4, filter: true, min_cutoff: 1, beta: .007, pinch_click: true, dwell_click: true, pinch_action: 'left', dwell_action: 'left', pinch_conf: .9, dwell_ms: 1200, dwell_radius: 30, debounce_ms: 250, audio: true, visual: true, mode: 0, tutorial_done: true, auto_train: true },
    cameras: ['HD Integrada 720p', 'Cámara USB 1080p'], files: [{ name: '20261006_200318_usuario.csv', samples: 3000, rounds: 3 }], runs: [{ run: '2026-10-06_200857_mlp-extras', acc: .872, rules: .799, promoted: true }],
    modes: [{ name: 'Neuro Asistido', icon: 'accessibility_new' }, { name: 'Precisión Dibujo', icon: 'draw' }, { name: 'Reposo Pausa', icon: 'bedtime' }], overlays: {} };
  const m = { tick: sig(), state: sig(), toast: sig(), trained: sig(), recDone: sig(), camError: sig(), getState: cb => cb(JSON.stringify(st)) };
  let paused = false, k = 0;
  m.toggleTracking = () => { paused = !paused; };
  m.setConfig = (key, v) => { st.cfg[key] = JSON.parse(v); };
  m.saveConfig = cb => cb && cb(true); m.saveInterest = (_, cb) => cb && cb(true);
  setInterval(() => {
    k++; const cx = .5 + .12 * Math.sin(k / 30), cy = .5 + .08 * Math.cos(k / 23);
    const lm = Array.from({ length: 21 }, (_, i) => { const f = Math.floor((i - 1) / 4), j = (i - 1) % 4; return i === 0 ? [cx, cy + .2] : [cx - .09 + f * .045 + (f === 0 ? -.04 : 0), cy + .08 - (j + 1) * (f === 0 ? .03 : .05)]; });
    m.tick.emit(JSON.stringify({ label: 'puntero', conf: 97, det: 98, side: 'Derecha', progress: (k % 40) / 40, cursor: [cx * 1920, cy * 1080], clicks: Math.floor(k / 40), fps: 29.8, latency: 21, bright: 128, cpu: 11.2, ram: 412, paused, hz: 120, exposure: -5, source: 'modelo', pressure: 18, jitter: 6, zone: [.22, .2, .78, .74], screen: [1920, 1080], ptr: [cx, cy - .05], event: ['Clic izquierdo (dwell)', 97], armed: null, rec: null, lm }));
  }, 66);
  return new Proxy(m, { get: (o, p) => p in o ? o[p] : (...a) => console.log('backend.' + String(p), ...a) });
}
